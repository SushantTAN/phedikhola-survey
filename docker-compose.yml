services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phedikhola
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - phedikhola_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phedikhola"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - phedikhola_redis:/data
volumes:
  phedikhola_pg:
  phedikhola_redis:
